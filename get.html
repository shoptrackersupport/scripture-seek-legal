<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Scripture Seek</title>
<meta name="description" content="Scripture Seek: daily Bible reading, reflection and games, by Tanucam. Free on Google Play and the App Store.">
<link rel="stylesheet" href="style.css">
<style>
.get{display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;padding-block:28px}
.get a.btn{display:block;width:min(100%,320px);padding:14px 18px;border-radius:999px;background:#d9b45f;color:#1a1405;font-weight:700;text-decoration:none}
.get a.btn.alt{background:transparent;color:inherit;border:2px solid #d9b45f}
.get p{margin:0;max-width:34em}
</style>
<script>
// Sends each phone to its own store. IOS_URL becomes the app's App Store page once it is published.
var PLAY_URL = "https://play.google.com/store/apps/details?id=com.tanucam.scriptureseek";
var IOS_URL = "https://apps.apple.com/search?term=Scripture%20Seek%20Tanucam";
var ua = navigator.userAgent || "";
var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
var isAndroid = /Android/.test(ua);
if (isIOS) location.replace(IOS_URL); else if (isAndroid) location.replace(PLAY_URL);
</script>
</head>

<header><div class="in">
  <div class="brand">
    <svg viewBox="0 0 200 240" aria-hidden="true"><rect x="26" y="20" width="160" height="208" rx="10" fill="#efe6cf"/><rect x="12" y="10" width="166" height="212" rx="12" fill="#2b3c74"/><rect x="12" y="10" width="24" height="212" rx="10" fill="#111938"/><rect x="48" y="26" width="116" height="180" rx="7" fill="none" stroke="#d9b45f" stroke-width="3"/><rect x="99" y="62" width="14" height="96" rx="2" fill="#d9b45f"/><rect x="76" y="88" width="60" height="14" rx="2" fill="#d9b45f"/></svg>

  </div>
  <h1>Daily Bible Reading &amp; Games</h1>
</div></header>
<main>
<section class="get">
  <p>Read the whole Bible in a year, understand every verse, listen, reflect and play. Free, in 13 languages, no account needed.</p>
  <a class="btn" id="play" href="https://play.google.com/store/apps/details?id=com.tanucam.scriptureseek">Get it on Google Play</a>
  <a class="btn alt" id="ios" href="https://apps.apple.com/search?term=Scripture%20Seek%20Tanucam">Download on the App Store</a>
  <script>document.getElementById("ios").href = IOS_URL; document.getElementById("play").href = PLAY_URL;</script>
</section>
